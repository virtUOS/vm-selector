<!DOCTYPE html>
<html lang=en>
<head>
<meta http-equiv=content-type content="text/html; charset=utf-8" />
<meta name=author content="Lars Kiesow" />
<meta name=viewport content="width=device-width, initial-scale=1">
<link rel=stylesheet type=text/css href=index.css />
<script type=application/javascript src=index.js></script>

<title>Virtual Machine Selector</title>
</head>
<body onload="load_config()">

<header>
	<img src='https://www.hs-osnabrueck.de/typo3conf/ext/hsosna_sitepackage/Resources/Public/Images/logo.svg' alt='Hochschule Osnabrück Logo' />
	<h1>Virtual Machine Selector</h1>
</header>

<div id=selector>
</div>

<div id=info>
	Der Platzhalter <code>{i}</code> ist für den Index der hinzugefügten Maschine nutzbar.
</div>

<div class=buttons>
	<input id=amount type=number value=1 min=1 />
	<button onclick="add_vm()">Hinzufügen</button>
</div>

Beantragte VMs:
<pre id=order>
</pre>

SSh-Key für Owner:
<pre>
ssh-ed25519 AAAAC3…
</pre>

<div class=buttons>
	<button onclick="copy()">🗎 Kopieren</button>
</div>

<footer>
	<a href=https://github.com/virtUOS/vm-selector>GitHub</a>
	|
	<a href=https://www.hs-osnabrueck.de/impressum/>Impressum</a>
</footer>

</body>
</html>
